name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0-alpha.2
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node, Bun, workerd or browser, with version
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction and expected vs actual result
    validations:
      required: true
