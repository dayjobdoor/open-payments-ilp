name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0
      - run: bun install --frozen-lockfile
      - run: bunx vp fmt --check
      - run: bunx vp lint --deny-warnings
      - run: node scripts/check-casts.mjs
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx tsc -p tsconfig.test.json
      - run: bunx vp test run
        env:
          CI: "true"
          GNAP_TEST_POSTGRES_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
      - run: bunx vp pack
      - run: node scripts/smoke-dist.mjs
