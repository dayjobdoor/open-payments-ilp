version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    # Pinned twice (devDependencies and `overrides`); Dependabot would bump only one. Bump by hand.
    ignore:
      - dependency-name: vite-plus
      - dependency-name: "@voidzero-dev/*"
      - dependency-name: vitest
    groups:
      minor-and-patch: { update-types: [minor, patch] }
