version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    # `vite` is pinned twice (devDependencies and `overrides`) and moves together with `vite-plus`; Dependabot would bump
    # only one of them. Bump by hand.
    ignore:
      - dependency-name: vite
      - dependency-name: vite-plus
      - dependency-name: "@voidzero-dev/*"
    groups:
      minor-and-patch: { update-types: [minor, patch] }
