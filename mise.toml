[tools]
node = "24.22.0"
bun = "1.4.4"

[tasks.check]
description = "Everything CI runs, in order"
run = [
  "bunx vp fmt --check",
  "bunx vp lint --deny-warnings",
  "node scripts/check-casts.mjs",
  "npx tsc -p tsconfig.json --noEmit",
  "npx tsc -p tsconfig.test.json",
  "bunx vp test run",
  "bunx vp pack",
  "node scripts/smoke-dist.mjs",
]

[tasks.dryrun]
description = "What `npm publish` would upload (no login, no upload); the `prepublishOnly` script runs the checks first"
# npm refuses a prerelease version without `--tag`; the name is irrelevant for a dry run.
run = "npm publish --dry-run --tag dryrun"

[tasks.generated]
description = "Fail when src/open-payments/generated/ is stale relative to openapi/ (needs network: bunx fetches TypeScript 5)"
run = "bun scripts/generate-types.ts --check"
